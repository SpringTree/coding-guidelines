name: Release

on:
  push:
    branches: [master]

# Repository writes (release PR, tag, GitHub release) use the GitHub App token,
# so the default token only needs to read
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Pull requests opened with GITHUB_TOKEN do not trigger pull_request workflows,
      # so required checks would never run on the release PR
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Opens or updates the release PR; when that PR is merged it creates the tag
      # and GitHub release and sets release_created
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing
    env:
      HUSKY: "0" # no git hooks needed in CI
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Staged publishing needs npm >= 11.15.0
      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile
      - run: bun run type-check
      - run: bun run lint
      - run: bun run fmt
      - run: bun run test
      - run: bun run build

      # Uploads to the npm staging area; it only goes live after a maintainer approves with 2FA.
      # Provenance is generated automatically by trusted publishing
      - run: npm stage publish --access public

      - name: Approval instructions
        run: |
          {
            echo "## Approve ${{ needs.release-please.outputs.tag_name }} on npm"
            echo ""
            echo "The package is staged and not yet public. A maintainer approves it with 2FA:"
            echo ""
            echo '```sh'
            echo "npm stage list @springtree/coding"
            echo "npm stage approve <stage-id>"
            echo '```'
            echo ""
            echo "Or use the Staged Packages tab on https://www.npmjs.com/package/@springtree/coding"
          } >> "$GITHUB_STEP_SUMMARY"
