name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Third-party actions are pinned by commit SHA (release tag in the comment): a tag
# can be moved to other code, a SHA cannot. The supply-chain `code` gate refuses
# mutable tags. Only adopt a release once it is older than the 7 day quarantine

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # Lowest supported node version, to prove the published bundle runs on it
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run type-check
      - run: bun run lint
      - run: bun run fmt
      - run: bun run test
      - name: Run bundle with node
        run: node dist/cli.js --version
