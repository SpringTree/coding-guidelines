name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Lowest supported node version, to prove the published bundle runs on it
      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run type-check
      - run: bun run lint
      - run: bun run fmt
      - run: bun run test
      - name: Run bundle with node
        run: node dist/cli.js --version
